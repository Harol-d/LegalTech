<p-card header="Paso 3: Ensamblaje, Previsualización y Exportación" subheader="Agente Ensamblador y Formateador">
  <!-- Barra superior con acciones -->
  <p-toolbar styleClass="mb-4">
    <ng-template pTemplate="start">
      <span class="text-sm font-medium">{{ documentTitle() }}</span>
    </ng-template>
    <ng-template pTemplate="end">
      <div class="flex gap-2">
        <p-button type="button" label="Descargar PDF" icon="pi pi-file-pdf" [loading]="exportingPdf()" (onClick)="downloadPdf()" />
        <p-button type="button" label="Descargar DOCX" icon="pi pi-file-word" severity="secondary" [loading]="exportingDocx()" (onClick)="downloadDocx()" />
      </div>
    </ng-template>
  </p-toolbar>

  <p-message severity="info" size="small" class="mb-4">
    Borrador generado con asistencia de IA. Requiere revisión humana y validación por un abogado antes de su uso.
    No constituye asesoría legal.
  </p-message>

  @if (error()) {
    <p-message severity="error">{{ error() }}</p-message>
  }

  @if (loadingPdf()) {
    <p-message severity="info" size="small">Ensamblando documento y compilando vista previa…</p-message>
  }

  <!-- Renderizado del documento final -->
  <app-pdf-previewer [src]="pdfSrc()" height="75vh" />
</p-card>
